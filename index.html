<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Foto Storage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    img {
      width: 100%;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="gallery" id="gallery"></div>

  <script>
    const username = "Qriz-art";
    const repo = "gudang";
    const folder = "assets";

    fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folder}`)
      .then(res => res.json())
      .then(files => {
        const gallery = document.getElementById("gallery");

        files.forEach(file => {
          if (file.type === "file" && /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)) {
            const img = document.createElement("img");
            img.src = file.download_url;
            gallery.appendChild(img);
          }
        });
      });
  </script>

</body>
</html>
